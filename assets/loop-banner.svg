<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
<title id="title">Awesome Loop Generative Models</title><desc id="desc">A reading map for generative models that revisit computation. A shared transformation refines a state through a feedback loop.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#142e3c"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#5eead4" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="280" rx="20" fill="url(#bg)"/><rect width="1280" height="280" rx="20" fill="url(#grid)"/>
<g font-family="Inter,Arial,Helvetica,sans-serif"><text x="54" y="53" font-size="13" font-weight="700" letter-spacing="3" fill="#5eead4">VIBELAB · LIVING PAPER COLLECTION</text>
<text x="52" y="120" font-size="51" font-weight="750" letter-spacing="-1.5" fill="#f1f5f9">Generative models.</text><text x="52" y="180" font-size="51" font-weight="750" letter-spacing="-1.5" fill="url(#accent)">Another pass.</text>
<text x="55" y="230" font-size="17" fill="#a8bdcc">Shared layers · Latent feedback · Memory · Iterative refinement</text>
